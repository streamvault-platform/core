# ---------------------------------------------------------------------------
# Kafka channel configuration — loaded via quarkus.config.locations
# Bootstrap servers live in application.properties with other infra config
# ---------------------------------------------------------------------------
# Producer: media.uploaded
mp.messaging.outgoing.media-uploaded.connector=smallrye-kafka
mp.messaging.outgoing.media-uploaded.topic=media.uploaded
mp.messaging.outgoing.media-uploaded.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Consumer: media.metadata-ready
mp.messaging.incoming.media-metadata-ready.connector=smallrye-kafka
mp.messaging.incoming.media-metadata-ready.topic=media.metadata-ready
mp.messaging.incoming.media-metadata-ready.group.id=streamvault-core
mp.messaging.incoming.media-metadata-ready.value.deserializer=io.streamvault.core.infra.kafka.deserializer.MetadataReadyEventDeserializer
mp.messaging.incoming.media-metadata-ready.failure-strategy=dead-letter-queue
mp.messaging.incoming.media-metadata-ready.dead-letter-queue.topic=media.metadata-ready.dlq
mp.messaging.incoming.media-metadata-ready.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Consumer: media.transcoded
mp.messaging.incoming.media-transcoded.connector=smallrye-kafka
mp.messaging.incoming.media-transcoded.topic=media.transcoded
mp.messaging.incoming.media-transcoded.group.id=streamvault-core
mp.messaging.incoming.media-transcoded.value.deserializer=io.streamvault.core.infra.kafka.deserializer.TranscodedEventDeserializer
mp.messaging.incoming.media-transcoded.failure-strategy=dead-letter-queue
mp.messaging.incoming.media-transcoded.dead-letter-queue.topic=media.transcoded.dlq
mp.messaging.incoming.media-transcoded.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
