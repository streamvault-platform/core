streamvault.media.path=target/streamvault-media-test
quarkus.http.body.uploads-directory=target/uploads-test
streamvault.internal.base-url=http://localhost:8081
# ---------------------------------------------------------------------------
# Test-only Kafka channels
# ---------------------------------------------------------------------------
mp.messaging.incoming.test-media-uploaded.connector=smallrye-kafka
mp.messaging.incoming.test-media-uploaded.topic=media.uploaded
mp.messaging.incoming.test-media-uploaded.value.deserializer=io.streamvault.core.infra.kafka.deserializer.TrackUploadedEventDeserializer
mp.messaging.incoming.test-media-uploaded.group.id=streamvault-core-test
mp.messaging.incoming.test-media-uploaded.auto.offset.reset=earliest
mp.messaging.outgoing.test-media-metadata-ready.connector=smallrye-kafka
mp.messaging.outgoing.test-media-metadata-ready.topic=media.metadata-ready
mp.messaging.outgoing.test-media-metadata-ready.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.test-media-transcoded.connector=smallrye-kafka
mp.messaging.outgoing.test-media-transcoded.topic=media.transcoded
mp.messaging.outgoing.test-media-transcoded.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Test spy: capture outbound watch.sync-requested events
mp.messaging.incoming.test-watch-sync-requested.connector=smallrye-kafka
mp.messaging.incoming.test-watch-sync-requested.topic=watch.sync-requested
mp.messaging.incoming.test-watch-sync-requested.value.deserializer=io.streamvault.core.infra.kafka.deserializer.WatchSyncRequestedEventDeserializer
mp.messaging.incoming.test-watch-sync-requested.group.id=streamvault-core-test-watch-sync
mp.messaging.incoming.test-watch-sync-requested.auto.offset.reset=earliest
# Test injector: push watch.sync-ready events into core
mp.messaging.outgoing.test-watch-sync-ready.connector=smallrye-kafka
mp.messaging.outgoing.test-watch-sync-ready.topic=watch.sync-ready
mp.messaging.outgoing.test-watch-sync-ready.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.incoming.test-scrobble-events.connector=smallrye-kafka
mp.messaging.incoming.test-scrobble-events.topic=scrobble.events
mp.messaging.incoming.test-scrobble-events.value.deserializer=io.streamvault.core.infra.kafka.deserializer.ScrobbleEventDeserializer
mp.messaging.incoming.test-scrobble-events.group.id=streamvault-core-test-scrobble
mp.messaging.incoming.test-scrobble-events.auto.offset.reset=earliest
