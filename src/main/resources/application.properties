streamvault.version=0.1.0-SNAPSHOT
# ---------------------------------------------------------------------------
# OpenAPI — served at /q/openapi, UI at /q/swagger-ui (dev mode only)
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Streamvault Core API
quarkus.smallrye-openapi.info-version=${streamvault.version}
quarkus.smallrye-openapi.info-description=Media library, auth, streaming and watch sync
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer
quarkus.smallrye-openapi.auto-add-security=true
quarkus.application.name=streamvault-core
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.rest.path=/api
# ---------------------------------------------------------------------------
# Datasource — reactive PostgreSQL
# Dev/test: Quarkus Dev Services auto-starts a container (no config needed)
# Prod: all three env vars are required
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
%prod.quarkus.datasource.reactive.url=${QUARKUS_DATASOURCE_REACTIVE_URL}
# TODO: Flyway uses JDBC; disable it after startup to free the connection pool
# ---------------------------------------------------------------------------
# Flyway — blocking datasource used only at startup for migrations
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# ---------------------------------------------------------------------------
# Logging — quarkus-logging-json enables JSON automatically in prod
# Dev overrides to human-readable format
# ---------------------------------------------------------------------------
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
# ---------------------------------------------------------------------------
# Hibernate Reactive
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=none
# ---------------------------------------------------------------------------
# JWT
# Dev: committed key pair in src/main/resources (safe — dev only, no prod data)
# Docker Compose / Helm: env vars point to auto-generated keys mounted at /jwt
# ---------------------------------------------------------------------------
mp.jwt.verify.issuer=${STREAMVAULT_AUTH_JWT_ISSUER:streamvault}
mp.jwt.verify.publickey.location=${STREAMVAULT_AUTH_JWT_PUBLIC_KEY_LOCATION:dev-public.pem}
smallrye.jwt.sign.key.location=${STREAMVAULT_AUTH_JWT_PRIVATE_KEY_LOCATION:dev-private.pem}
streamvault.auth.access-token-ttl-minutes=${STREAMVAULT_AUTH_ACCESS_TOKEN_TTL_MINUTES:15}
streamvault.auth.refresh-token-ttl-days=${STREAMVAULT_AUTH_REFRESH_TOKEN_TTL_DAYS:30}
# ---------------------------------------------------------------------------
# Media storage — uploaded audio files
# Backend choices: filesystem (default), s3
# ---------------------------------------------------------------------------
streamvault.storage.backend=${STREAMVAULT_STORAGE_BACKEND:filesystem}
streamvault.media.path=${STREAMVAULT_MEDIA_PATH:/var/streamvault/media}
%dev.streamvault.media.path=target/streamvault-media
%test.streamvault.media.path=target/streamvault-media-test
# Multipart upload — temp dir for incoming files before they are moved to media.path
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=target/uploads
quarkus.http.body.delete-uploaded-files-on-end=false
%test.quarkus.http.body.uploads-directory=target/uploads-test
# ---------------------------------------------------------------------------
# Kafka — always required (KRaft mode, no Zookeeper)
# Dev/test: Quarkus Dev Services auto-starts a Redpanda container
# Prod: KAFKA_BOOTSTRAP_SERVERS must be set
# ---------------------------------------------------------------------------
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
# Producer: media.uploaded
mp.messaging.outgoing.media-uploaded.connector=smallrye-kafka
mp.messaging.outgoing.media-uploaded.topic=media.uploaded
mp.messaging.outgoing.media-uploaded.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Consumer: media.metadata-ready
mp.messaging.incoming.media-metadata-ready.connector=smallrye-kafka
mp.messaging.incoming.media-metadata-ready.topic=media.metadata-ready
mp.messaging.incoming.media-metadata-ready.group.id=streamvault-core
mp.messaging.incoming.media-metadata-ready.value.deserializer=io.streamvault.core.infra.kafka.deserializer.MetadataReadyEventDeserializer
mp.messaging.incoming.media-metadata-ready.failure-strategy=dead-letter-queue
mp.messaging.incoming.media-metadata-ready.dead-letter-queue.topic=media.metadata-ready.dlq
mp.messaging.incoming.media-metadata-ready.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Consumer: media.transcoded
mp.messaging.incoming.media-transcoded.connector=smallrye-kafka
mp.messaging.incoming.media-transcoded.topic=media.transcoded
mp.messaging.incoming.media-transcoded.group.id=streamvault-core
mp.messaging.incoming.media-transcoded.value.deserializer=io.streamvault.core.infra.kafka.deserializer.TranscodedEventDeserializer
mp.messaging.incoming.media-transcoded.failure-strategy=dead-letter-queue
mp.messaging.incoming.media-transcoded.dead-letter-queue.topic=media.transcoded.dlq
mp.messaging.incoming.media-transcoded.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
